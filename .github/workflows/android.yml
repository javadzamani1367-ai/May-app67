name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM modules + all Android variants)
        run: ./gradlew test --stacktrace

      - name: Assemble debug APKs (bazaar, myket, dev)
        run: ./gradlew assembleDebug

      - name: Android Lint (dev)
        run: ./gradlew :app:lintDevDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: roozban-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
