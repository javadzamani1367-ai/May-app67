name: Android APK

# Builds an installable debug APK on every push to the development branch and
# attaches it to the run. The container this project is developed in has no
# Android SDK, so this workflow is where the app actually gets compiled.

# One build per branch; a new push supersedes the run it replaces.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "claude/**"
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Restore and save are split so a failed build still leaves a warm cache;
      # otherwise every fix-and-retry round re-downloads the whole toolchain.
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The font is not kept in the repository (SIL OFL, and it is a binary);
      # the app builds without it and falls back to the system font.
      - name: Fetch Vazirmatn
        continue-on-error: true
        run: |
          set -x
          mkdir -p android/app/src/main/assets/fonts
          curl -fsSL -o /tmp/vazirmatn.zip \
            https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -q -o /tmp/vazirmatn.zip -d /tmp/vazirmatn
          find /tmp/vazirmatn -name 'Vazirmatn-Regular.ttf' -exec cp {} android/app/src/main/assets/fonts/ \;
          find /tmp/vazirmatn -name 'Vazirmatn-Bold.ttf' -exec cp {} android/app/src/main/assets/fonts/ \;
          ls -la android/app/src/main/assets/fonts/

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Unsigned, so it cannot be installed, but it is the honest answer to
      # "how big is the app": R8 and resource shrinking run here, the debug
      # tooling is gone, and the size is what a signed release would weigh.
      - name: Build release APK (unsigned, for size and R8 checks)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Report APK sizes
        run: |
          ls -lh android/app/build/outputs/apk/debug/*.apk
          ls -lh android/app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-inspection-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-inspection-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # A tag turns the build into a release, so the APK can be downloaded
      # straight onto a phone instead of unzipping a CI artifact.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          name: ${{ github.ref_name }}
          body: |
            نسخه آزمایشی میدانی — امضا شده با کلید debug.
            برای نصب، «نصب از منابع ناشناس» را برای مرورگر یا مدیر فایل فعال کنید.
          generate_release_notes: false

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          if-no-files-found: ignore
