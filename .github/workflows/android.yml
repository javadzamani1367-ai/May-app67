name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM modules + all Android variants)
        run: ./gradlew test --continue

      - name: Print Room schemas
        run: for f in core/database/schemas/*/*.json; do echo "=== SCHEMA $f"; cat "$f"; echo; echo "=== END"; done

      - name: Assemble debug APKs (bazaar, myket, dev)
        run: ./gradlew assembleDebug

      - name: Android Lint (dev)
        run: ./gradlew :app:lintDevDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: roozban-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      # Test build for manual review: a rolling pre-release with a stable download URL.
      - name: Publish test APK (pre-release "roozban-dev")
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/roozban-architecture-planning-w81883'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/dev/debug/*.apk roozban-dev.apk
          gh release delete roozban-dev --cleanup-tag --yes || true
          gh release create roozban-dev roozban-dev.apk \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "روزبان — نسخه‌ی آزمایشی" \
            --notes "نسخه‌ی آزمایشی (debug) از commit ${GITHUB_SHA::7}. فقط برای بررسی."
