name: Android APK

# Builds an installable debug APK on every push to the development branch and
# attaches it to the run. The container this project is developed in has no
# Android SDK, so this workflow is where the app actually gets compiled.

# One build per branch; a new push supersedes the run it replaces.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "claude/**"
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Restore and save are split so a failed build still leaves a warm cache;
      # otherwise every fix-and-retry round re-downloads the whole toolchain.
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The font is not kept in the repository (SIL OFL, and it is a binary);
      # the app builds without it and falls back to the system font.
      - name: Fetch Vazirmatn
        continue-on-error: true
        run: |
          set -x
          mkdir -p android/app/src/main/assets/fonts
          curl -fsSL -o /tmp/vazirmatn.zip \
            https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -q -o /tmp/vazirmatn.zip -d /tmp/vazirmatn
          find /tmp/vazirmatn -name 'Vazirmatn-Regular.ttf' -exec cp {} android/app/src/main/assets/fonts/ \;
          find /tmp/vazirmatn -name 'Vazirmatn-Bold.ttf' -exec cp {} android/app/src/main/assets/fonts/ \;
          ls -la android/app/src/main/assets/fonts/

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # The real signing key comes from repository secrets and never from the
      # repo. Until those exist a throwaway key is generated here, so the
      # signing path is exercised on every run rather than assumed, and the
      # shrunk release build is installable for field testing.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
            echo "Signing with the configured release key."
          else
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 \
              -alias smoke -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass smoketest -keypass smoketest \
              -dname "CN=Crypto Inspection field test, OU=Unofficial build, C=IR"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
            echo "No release key configured; signed with a throwaway test key."
          fi
          echo "path=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'smoketest' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'smoke' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'smoketest' }}
        run: ./gradlew --no-daemon assembleRelease

      # Proof, not assumption: an APK that only looks signed installs on
      # nobody's phone.
      - name: Verify release signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Report APK sizes
        run: |
          ls -lh android/app/build/outputs/apk/debug/*.apk
          ls -lh android/app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-inspection-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-inspection-release-${{ steps.signing.outputs.ephemeral == 'true' && 'testkey' || 'signed' }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A tag turns the build into a release, so the APK can be downloaded
      # straight onto a phone instead of unzipping a CI artifact.
      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.ephemeral == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/*.apk
          name: ${{ github.ref_name }}
          body: |
            نسخه آزمایشی میدانی — امضا شده با کلید debug.
            برای نصب، «نصب از منابع ناشناس» را برای مرورگر یا مدیر فایل فعال کنید.
          generate_release_notes: false

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          if-no-files-found: ignore
