name: Android APK

# Builds an installable debug APK on every push to the development branch and
# attaches it to the run. The container this project is developed in has no
# Android SDK, so this workflow is where the app actually gets compiled.

# One build per branch; a new push supersedes the run it replaces.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "claude/**"
      - main
    tags:
      - "v*"
  pull_request:
  # Pushing a tag from some networks is blocked, and a release is the only way
  # to get the app onto a phone without signing in to GitHub. Running the
  # workflow by hand with a version here publishes one, and GitHub creates the
  # tag itself from the commit that was built.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "نسخه برای انتشار، مثل v1.0.0 — خالی بگذارید تا فقط بیلد شود"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Needed to create the release; everything else here only reads.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK. The setup-android
      # action mostly re-accepts its licences, and when that sdkmanager call
      # fails the whole build dies twenty seconds in — which is exactly what
      # happened. Accepting them here cannot fail the job, and AGP downloads
      # whatever platform or build-tools version is still missing.
      - name: Accept Android SDK licences
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$MANAGER" ]; then
            yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      # Restore and save are split so a failed build still leaves a warm cache;
      # otherwise every fix-and-retry round re-downloads the whole toolchain.
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The font is not kept in the repository (SIL OFL, and it is a binary);
      # the app builds without it and falls back to the system font.
      - name: Fetch Vazirmatn
        continue-on-error: true
        run: |
          set -x
          mkdir -p android/app/src/main/assets/fonts
          curl -fsSL -o /tmp/vazirmatn.zip \
            https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -q -o /tmp/vazirmatn.zip -d /tmp/vazirmatn
          find /tmp/vazirmatn -name 'Vazirmatn-Regular.ttf' -exec cp {} android/app/src/main/assets/fonts/ \;
          find /tmp/vazirmatn -name 'Vazirmatn-Bold.ttf' -exec cp {} android/app/src/main/assets/fonts/ \;
          # Optional weights for the type scale; the app falls back without them.
          find /tmp/vazirmatn -name 'Vazirmatn-Medium.ttf' -exec cp {} android/app/src/main/assets/fonts/ \;
          find /tmp/vazirmatn -name 'Vazirmatn-ExtraBold.ttf' -exec cp {} android/app/src/main/assets/fonts/ \;
          ls -la android/app/src/main/assets/fonts/

      # Catches in a second what the resource merger otherwise reports five
      # minutes into a build: a duplicate string, a reference to one that does
      # not exist, a duplicate declaration, a file over the length rule.
      - name: Static checks
        run: python3 tools/verify-resources.py

      # The server tests need no database: Jalali conversion, PHP syntax, and
      # that the server's schema still matches the phone's. That last one is
      # how the missing approval columns were found.
      - name: Server tests
        run: php server/tests/run.php

      # The runner image ships MySQL but leaves it stopped. Starting it turns
      # the integration test from "skipped" into a real check of every query
      # against a real database — which is how the reserved word `row_number`
      # was found, the one that stopped schema.sql importing at all.
      - name: Start MySQL
        run: |
          sudo systemctl start mysql.service || sudo service mysql start
          for i in $(seq 1 30); do
            mysqladmin --host=127.0.0.1 --user=root --password=root ping && break
            sleep 1
          done

      - name: Integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: inspection_ci
          # Without this, a database that failed to start would make the test
          # skip itself and report success.
          DB_REQUIRED: "1"
        run: php server/tests/integration.php

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testExpertDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # The real signing key comes from repository secrets and never from the
      # repo. Until those exist a throwaway key is generated here, so the
      # signing path is exercised on every run rather than assumed, and the
      # shrunk release build is installable for field testing.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
            echo "Signing with the configured release key."
          else
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 \
              -alias smoke -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass smoketest -keypass smoketest \
              -dname "CN=Crypto Inspection field test, OU=Unofficial build, C=IR"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
            echo "No release key configured; signed with a throwaway test key."
          fi
          echo "path=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'smoketest' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'smoke' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'smoketest' }}
        run: ./gradlew --no-daemon assembleRelease

      # Proof, not assumption: an APK that only looks signed installs on
      # nobody's phone.
      # Proof for both apps: an APK that only looks signed installs on
      # nobody's phone, and the manager build is no less important than the
      # expert one.
      - name: Verify release signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in android/app/build/outputs/apk/*/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Report APK sizes
        run: ls -lh android/app/build/outputs/apk/*/*/*.apk

      - name: Upload expert APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-inspection-expert-${{ steps.signing.outputs.ephemeral == 'true' && 'testkey' || 'signed' }}-apk
          path: android/app/build/outputs/apk/expert/release/*.apk
          if-no-files-found: error

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-inspection-manager-${{ steps.signing.outputs.ephemeral == 'true' && 'testkey' || 'signed' }}-apk
          path: android/app/build/outputs/apk/manager/release/*.apk
          if-no-files-found: error

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: crypto-inspection-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      # A tag turns the build into a release, so the APK can be downloaded
      # straight onto a phone instead of unzipping a CI artifact.
      # Published whatever the key situation is. Withholding the release
      # until an official key exists left the one person who needs to install
      # the app with nowhere to download it from; the body says plainly which
      # key signed it, and what that costs.
      - name: Publish release
        if: >-
          ${{ startsWith(github.ref, 'refs/tags/v')
              || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/*/release/*.apk
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body: |
            دو فایل: `app-expert-release.apk` برای کارشناس و
            `app-manager-release.apk` برای مدیر. هر دو روی یک گوشی هم نصب می‌شوند.

            برای نصب، «نصب از منابع ناشناس» را برای مرورگر یا مدیر فایل فعال کنید.

            ${{ steps.signing.outputs.ephemeral == 'true' && '**هشدار درباره امضا:** این نسخه با یک کلید یک‌بارمصرف امضا شده که هر بیلد عوض می‌شود. یعنی روی نسخه قبلی نصب نمی‌شود و باید اول نسخه قبلی را حذف کنید — با حذف آن، داده‌های داخل اپ هم پاک می‌شود. برای اینکه نسخه‌های بعدی روی هم به‌روزرسانی شوند، کلید امضای رسمی را یک بار در Secrets مخزن بگذارید؛ راهنمایش در README است.' || 'با کلید رسمی مخزن امضا شده؛ روی نسخه قبلی به‌روزرسانی می‌شود.' }}
          generate_release_notes: false

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          if-no-files-found: ignore
