name: TTS voices eval (Persian)

# Compares Persian voices for reading aloud: every candidate reads the same eight sentences;
# a Persian speech model transcribes the audio back and the character error rate shows how
# clearly each voice pronounces. Also prints speed and licenses, publishes comparison samples,
# and packages the Matcha voices (with their vocoder) for the app.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tts-eval.yml'
      - 'tools/tts_eval/**'

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Persian models in the sherpa-onnx release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tts-models -R k2-fsa/sherpa-onnx --json assets --jq '.assets[] | "\(.name) \(.size)"' | grep -i -E "fa_|fa-|persian|farsi" || true
          gh release view vocoder-models -R k2-fsa/sherpa-onnx --json assets --jq '.assets[] | "\(.name) \(.size)"' || true

      - name: Licenses
        run: |
          for r in mah92/Musa-FA_EN-Matcha-TTS-Model mah92/Khadijah-FA_EN-Matcha-TTS-Model; do
            echo "=== $r"
            curl -sSfL "https://huggingface.co/api/models/$r" | python3 -c "import json,sys; d=json.load(sys.stdin); print('license:', d.get('cardData',{}).get('license'), d.get('tags'))" || true
            curl -sSfL "https://huggingface.co/$r/raw/main/README.md" | head -60 || true
          done

      - name: Download voices
        run: |
          set -e
          mkdir -p voices && cd voices
          for n in vits-piper-fa-haaniye_low vits-mimic3-fa-haaniye_low matcha-tts-fa_en-musa matcha-tts-fa_en-khadijah; do
            curl -sSfL -o $n.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$n.tar.bz2"
            tar xjf $n.tar.bz2 && rm $n.tar.bz2
            ls -la $n | head -8
          done
          for f in vocos-22khz-univ.onnx hifigan_v1.onnx hifigan_v2.onnx; do
            curl -sSfL -o $f https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/$f
          done
          ls -la *.onnx
          cat vits-piper-fa-haaniye_low/MODEL_CARD vits-piper-fa-haaniye_low/README* vits-mimic3-fa-haaniye_low/README* vits-mimic3-fa-haaniye_low/LICENSE* 2>/dev/null | head -60 || true
          ls vits-piper-fa-haaniye_low vits-mimic3-fa-haaniye_low

      - name: Synthesize and judge
        run: |
          pip install -q sherpa-onnx soundfile numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -q transformers librosa
          python tools/tts_eval/eval.py voices out
        env:
          VOICES: >-
            vits-piper-fa-haaniye_low vits-mimic3-fa-haaniye_low
            matcha-tts-fa_en-khadijah+vocos-22khz-univ.onnx matcha-tts-fa_en-khadijah+hifigan_v1.onnx matcha-tts-fa_en-khadijah+hifigan_v2.onnx
            matcha-tts-fa_en-musa+vocos-22khz-univ.onnx matcha-tts-fa_en-musa+hifigan_v1.onnx

      - name: Package Matcha voices
        if: false
        run: |
          set -e
          cd voices
          for v in musa khadijah; do
            d=matcha-tts-fa_en-$v
            cp vocos-22khz-univ.onnx $d/vocoder.onnx
            (cd $d && zip -q -r -9 ../../out/roozban-tts-matcha-$v.zip model.onnx tokens.txt vocoder.onnx espeak-ng-data)
          done
          cd ../out && for f in *.zip; do echo "ASSET $f $(stat -c %s "$f") $(sha256sum "$f" | cut -d' ' -f1)"; done

      - name: Publish samples and packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload tts-voices out/* -R "$GITHUB_REPOSITORY" --clobber
