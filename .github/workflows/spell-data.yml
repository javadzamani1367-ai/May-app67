name: Persian spelling data and eval

# Builds the word and word-pair frequencies the dictation spell corrector uses (Persian Wikipedia
# plus an everyday-speech word list) and measures the corrector on long-form dictation: settings
# are chosen on half of the recordings and reported on the other half.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/spell-data.yml'
      - 'tools/spell/**'
      - 'ai/core/src/main/kotlin/ir/roozban/ai/core/text/**'

concurrency:
  group: spell-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download sources
        run: |
          set -e
          curl -sSfL https://dumps.wikimedia.org/fawiki/latest/ -o index.html
          grep -oE 'fawiki-latest-pages-articles[0-9]+\.xml-p[0-9]+p[0-9]+\.bz2' index.html | sort -u -V | head -4 > parts.txt
          cat parts.txt
          : > wiki.xml.bz2
          while read p; do curl -sSfL "https://dumps.wikimedia.org/fawiki/latest/$p" >> wiki.xml.bz2; done < parts.txt
          ls -la wiki.xml.bz2
          curl -sSfL -o subs.txt https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/fa/fa_full.txt || true
          curl -sSfL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/LICENSE | head -5 || true
          wc -l subs.txt || true
      - name: Build
        run: python3 tools/spell/build.py spell wiki.xml.bz2 subs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spell-data
          path: spell/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view spell-data -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create spell-data -R "$GITHUB_REPOSITORY" --prerelease --title "Persian spelling data" --notes "Word and word-pair frequencies for the dictation spell corrector (tools/spell). Built from Persian Wikipedia (CC BY-SA) and FrequencyWords."
          gh release upload spell-data spell/* -R "$GITHUB_REPOSITORY" --clobber
          for f in spell/*; do echo "ASSET $(basename $f) $(stat -c %s $f) $(sha256sum $f | cut -d' ' -f1)"; done

  eval:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: spell-data
          path: spell
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg > /dev/null
      - run: python3 tools/speech_eval/eval.py prepare clips 48 && python3 tools/speech_eval/eval.py long clips 6 250,400,550,800
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build speech bench
        run: |
          cmake -S ai/runtime/src/main/cpp -B bench-build -DGGML_NATIVE=OFF > /dev/null
          cmake --build bench-build --target roozban-speech-bench -j "$(nproc)"
      - run: curl -L --fail --retry 3 -o model.bin "https://github.com/${{ github.repository }}/releases/download/speech-models/roozban-whisper-base-fa-q5_1.bin"
      - name: Without and with spelling correction
        run: |
          run() {
            ./gradlew -q :ai:eval:longform --args="$PWD/bench-build/roozban-speech-bench $PWD/model.bin $PWD/clips/long_list.txt new" > "$1.txt"
            grep PIECES "$1.txt"
            for half in "tune:long-0[0-3]" "test:long-0[4-7]"; do
              python3 tools/speech_eval/eval.py score-long clips "$1.txt" "${half#*:}" | tail -1 | sed "s/^/$1 ${half%%:*} /" | tee -a summary.txt
            done
          }
          run none
          export ROOZBAN_SPELL_DIR=$PWD/spell
          ROOZBAN_SPELL=3.5,1.5,5,4,1 run default
          ROOZBAN_SPELL=4.5,2,7,5,1 run careful
          ROOZBAN_SPELL=3,1.2,3,3,1 run bold
          ROOZBAN_SPELL=3.5,1.5,5,4,1.5 run context
          ROOZBAN_SPELL=3.5,1.5,5,6,1 run keepwords
          cat summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Examples of changes
        if: always()
        run: |
          python3 - <<'PY'
          import re
          a = {l.split("\t")[1]: l.rstrip("\n").split("\t")[3] for l in open("none.txt") if l.startswith("RESULT")}
          b = {l.split("\t")[1]: l.rstrip("\n").split("\t")[3] for l in open("default.txt") if l.startswith("RESULT")}
          n = 0
          for k in a:
              for x, y in zip(a[k].split(), b.get(k, "").split()):
                  if x != y and n < 60:
                      print(x, "->", y)
                      n += 1
          PY
