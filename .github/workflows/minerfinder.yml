name: MinerFinder APK

# «ماینریاب»: tests, then debug and release APKs on every push that touches
# the app. Each run uploads the APKs as an artifact and replaces the
# `minerfinder-latest` release, whose files download straight onto a phone
# without signing in to GitHub.

on:
  push:
    paths:
      - "minerfinder/**"
      - ".github/workflows/minerfinder.yml"
  workflow_dispatch:

concurrency:
  group: minerfinder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: minerfinder

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$MANAGER" ]; then
            yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mf-gradle-${{ runner.os }}-${{ hashFiles('minerfinder/**/*.gradle.kts', 'minerfinder/gradle/libs.versions.toml') }}
          restore-keys: mf-gradle-${{ runner.os }}-

      # Without a release key in the secrets, the APKs are signed with the
      # debug key Gradle creates. Keeping that key in the cache means the
      # next build carries the same signature and installs over this one
      # instead of asking to uninstall first.
      - name: Restore signing key
        id: debugkey
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: mf-debug-keystore-v1

      - name: Prepare release key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mf.jks"
            echo "MF_KEYSTORE_PATH=$RUNNER_TEMP/mf.jks" >> "$GITHUB_ENV"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APKs
        env:
          MF_KEYSTORE_PASSWORD: ${{ secrets.MF_KEYSTORE_PASSWORD }}
          MF_KEY_ALIAS: ${{ secrets.MF_KEY_ALIAS }}
          MF_KEY_PASSWORD: ${{ secrets.MF_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Save signing key
        if: steps.debugkey.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: mf-debug-keystore-v1

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/minerfinder.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/minerfinder-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/minerfinder.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minerfinder-apk
          path: minerfinder/dist/*.apk
          if-no-files-found: error

      # One rolling release, replaced on every push, so the download link
      # never changes:
      # https://github.com/<owner>/<repo>/releases/download/minerfinder-latest/minerfinder.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.signing.outputs.kind }}
        run: |
          gh release delete minerfinder-latest --cleanup-tag --yes || true
          if [ "$KIND" = "release" ]; then
            SIGNED="با کلید رسمی مخزن امضا شده است."
          else
            SIGNED="با کلید ساخت (debug) امضا شده که در کش گیت‌هاب نگه داشته می‌شود؛ نسخه‌های بعدی روی همین نصب می‌شوند. اگر روزی اندروید خطای امضا داد، نسخه قبلی را حذف و این را نصب کنید."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          آخرین ساخت «ماینریاب» از شاخه \`${GITHUB_REF_NAME}\` (اجرای شماره ${GITHUB_RUN_NUMBER}، کامیت \`${GITHUB_SHA::7}\`).

          - \`minerfinder.apk\` — نسخه اصلی برای نصب
          - \`minerfinder-debug.apk\` — نسخه اشکال‌یابی، بزرگ‌تر و کندتر

          برای نصب، «نصب از منابع ناشناس» را برای مرورگر یا مدیر فایل فعال کنید. ${SIGNED}
          NOTES
          gh release create minerfinder-latest dist/minerfinder.apk dist/minerfinder-debug.apk \
            --target "$GITHUB_SHA" \
            --title "ماینریاب — آخرین ساخت (${GITHUB_RUN_NUMBER})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mf-gradle-${{ runner.os }}-${{ hashFiles('minerfinder/**/*.gradle.kts', 'minerfinder/gradle/libs.versions.toml') }}

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minerfinder-reports
          path: |
            minerfinder/core/build/reports/
            minerfinder/app/build/reports/
          if-no-files-found: ignore
