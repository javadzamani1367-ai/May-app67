# Compose codegen on this many screens needs real headroom; at 2g the Kotlin
# backend spends its time in GC instead of compiling.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Transitive on purpose: the apps read the shared module's strings and
# drawables through their own R, so moving a component into :core never means
# rewriting every screen that names one of its strings.
android.nonTransitiveRClass=false
kotlin.code.style=official
